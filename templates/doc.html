<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — বৌ-ঠাকুরাণীর হাট</title>
    <link rel="stylesheet" href="../assets/reader.css">
</head>
<body>
    <div class="layout">
        {% include "_sidebar.html" %}
        <main class="content">
            <div class="container">
                <header class="page-header">
                    <h1>{{ title }}</h1>
                    <p class="doc-lang-switch">
                        {% if lang == "ja" %}<a href="{{ other_href }}">English version</a>{% else %}<a href="{{ other_href }}">日本語版</a>{% endif %}
                    </p>
                </header>

                <article class="doc-content">
                    {{ body_html|safe }}
                </article>
            </div>
        </main>
    </div>
    {% if has_mermaid %}
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        mermaid.initialize({ startOnLoad: true, theme: "neutral" });
    </script>
    {% endif %}
</body>
</html>
